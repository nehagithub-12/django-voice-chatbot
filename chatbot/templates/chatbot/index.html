
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chatbot</title>
</head>
<body>
    <h1>Voice Chatbot</h1>
    <p>Ask a question and get a response.</p>

    <input type="text" id="message" placeholder="Type your message">
    <button id="sendButton" type="button">Send</button>

    <br><br>

    <button id="voiceButton" type="button">Start Voice Chat</button>

    <div id="response" style="margin-top: 20px; white-space: pre-wrap;"></div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var messageInput = document.getElementById("message");
            var sendButton = document.getElementById("sendButton");
            var voiceButton = document.getElementById("voiceButton");
            var responseDiv = document.getElementById("response");

            sendButton.addEventListener("click", sendMessage);

            messageInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });

            voiceButton.addEventListener("click", startVoiceChat);

            async function sendMessage() {
                var message = messageInput.value.trim();

                if (!message) {
                    responseDiv.textContent = "Please enter a message.";
                    return;
                }

                responseDiv.textContent = "Thinking...";
                sendButton.disabled = true;

                try {
                    var response = await fetch("/chatbot/response/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: new URLSearchParams({
                            message: message
                        })
                    });

                    var responseText = await response.text();
                    var data;

                    try {
                        data = JSON.parse(responseText);
                    } catch (parseError) {
                        throw new Error(
                            "Unexpected server response. HTTP status: " +
                            response.status
                        );
                    }

                    if (!response.ok) {
                        responseDiv.textContent =
                            data.reply || "Request failed. HTTP status: " +
                            response.status;
                        return;
                    }

                    var reply = data.reply ||
                        "Sorry, no response was returned.";

                    responseDiv.textContent = reply;
                    speakReply(reply);

                } catch (error) {
                    responseDiv.textContent = "Error: " + error.message;
                    console.error("Chatbot error:", error);
                } finally {
                    sendButton.disabled = false;
                }
            }

            function speakReply(text) {
                if (!("speechSynthesis" in window)) {
                    return;
                }

                window.speechSynthesis.cancel();

                var utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = "en-IN";
                utterance.rate = 1;
                utterance.pitch = 1;

                window.speechSynthesis.speak(utterance);
            }

            function startVoiceChat() {
                var SpeechRecognition =
                    window.SpeechRecognition ||
                    window.webkitSpeechRecognition;

                if (!SpeechRecognition) {
                    responseDiv.textContent =
                        "Voice recognition is not supported. Please try Google Chrome.";
                    return;
                }

                var recognition = new SpeechRecognition();

                recognition.lang = "en-IN";
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function () {
                    responseDiv.textContent =
                        "Listening... Please speak.";
                    voiceButton.disabled = true;
                };

                recognition.onresult = function (event) {
                    var transcript = event.results[0][0].transcript;
                    messageInput.value = transcript;
                    sendMessage();
                };

                recognition.onerror = function (event) {
                    responseDiv.textContent =
                        "Voice recognition error: " + event.error;
                };

                recognition.onend = function () {
                    voiceButton.disabled = false;
                };

                try {
                    recognition.start();
                } catch (error) {
                    responseDiv.textContent =
                        "Could not start voice recognition: " +
                        error.message;
                    voiceButton.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
